name: Podklady pro mapu

# Stáhne data z OpenStreetMap, BRouteru, OSRM a Wikidat do data/raw/
# a commitne je zpět do větve. Spouští se ručně nebo změnou vstupů v tools/.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Kroky (missing overpass brouter osrm wikidata commons pages photos), prázdné = výchozí'
        required: false
        default: ''
  push:
    paths:
      - 'tools/fetch_data.py'
      - 'tools/routes.json'
      - 'tools/poi_candidates.json'
      - 'tools/images.json'
      - 'tools/pages.json'
      - 'tools/photo_candidates.json'

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # nejnovější stav větve (i s daty z předchozího běhu), ne jen commit, který běh spustil
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Výběr kroků podle změněných vstupů
        id: plan
        env:
          INPUT_STEPS: ${{ github.event.inputs.steps }}
          BEFORE: ${{ github.event.before }}
        run: |
          STEPS="$INPUT_STEPS"
          if [ -z "$STEPS" ] && [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            has() { echo "$CHANGED" | grep -qx "tools/$1"; }
            STEPS="missing"
            if has routes.json || has poi_candidates.json; then STEPS="$STEPS brouter osrm"; fi
            if has images.json; then STEPS="$STEPS commons"; fi
            if has pages.json; then STEPS="$STEPS pages"; fi
            if has photo_candidates.json; then STEPS="$STEPS photos"; fi
          fi
          echo "Kroky: ${STEPS:-výchozí}"
          echo "steps=$STEPS" >> "$GITHUB_OUTPUT"
      - name: Stažení podkladů
        run: python tools/fetch_data.py ${{ steps.plan.outputs.steps }}
      - name: Uložení do repozitáře
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw docs/img 2>/dev/null || git add data/raw
          if git diff --cached --quiet; then
            echo "Žádné změny v podkladech."
            exit 0
          fi
          git commit -m "Aktualizace podkladů (OSM, trasy, časy jízdy, stránky)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
