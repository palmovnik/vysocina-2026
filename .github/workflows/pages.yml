name: Nasazení webu (gh-pages)

# Zkopíruje hotový web ze složky docs/ do větve gh-pages, ze které ho
# GitHub Pages zveřejňuje na https://palmovnik.github.io/vysocina-2026/
on:
  push:
    branches:
      - 'claude/mlyn-vikinek-area-guide-9f2csb'
      - 'main'
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publikace docs/ do větve gh-pages
        run: |
          set -e
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth 1 origin gh-pages; then
            git worktree add /tmp/site FETCH_HEAD
            git -C /tmp/site checkout -B gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/site
          fi
          rsync -a --delete --exclude '.git' docs/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then
            echo "Web se nezměnil."
            exit 0
          fi
          git commit -m "Web z ${GITHUB_SHA::7}"
          git push origin gh-pages
