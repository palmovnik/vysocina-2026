name: GitHub Pages

# Nasadí složku docs/ jako web. Jednorázově je potřeba v nastavení repozitáře
# (Settings → Pages → Build and deployment → Source) zvolit „GitHub Actions“.
on:
  push:
    branches:
      - 'claude/mlyn-vikinek-area-guide-9f2csb'
      - 'main'
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Zkusí Pages zapnout samo; s výchozím tokenem to GitHub obvykle nedovolí,
          # pak je potřeba jednou nastavit Settings → Pages → Source: GitHub Actions.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
